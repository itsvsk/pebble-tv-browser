name: Release APK

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release or retry, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and require a commit from main
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must be vMAJOR.MINOR.PATCH without leading zeroes' >&2
            exit 1
          fi
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/published-tags"
          python3 - "$RELEASE_TAG" "$RUNNER_TEMP/published-tags" <<'PY'
          from pathlib import Path
          import re
          import sys
          def version(tag):
              return tuple(map(int, tag[1:].split('.')))
          current = version(sys.argv[1])
          for tag in Path(sys.argv[2]).read_text().splitlines():
              if re.fullmatch(r'v\d+\.\d+\.\d+', tag) and current <= version(tag):
                  raise SystemExit(f'Choose a version above the published release {tag}')
          PY
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/android-ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  release:
    name: Sign and publish APK
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Install build SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 is missing in github-release' >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pebble-release.jks"
      - name: Build signed release
        env:
          PEBBLE_VERSION: ${{ needs.validate.outputs.version }}
          PEBBLE_KEYSTORE_PATH: ${{ runner.temp }}/pebble-release.jks
          PEBBLE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PEBBLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PEBBLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease
          -PpebbleVersionName="$PEBBLE_VERSION" -PrequireReleaseSigning=true
          --no-daemon --no-configuration-cache --stacktrace
      - name: Verify signature and prepare release assets
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PEBBLE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          APK=app/build/outputs/apk/release/app-release.apk
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/apksigner" verify --print-certs "$APK" | grep -F "$(openssl x509 -in docs/release-signing-certificate.pem -outform DER | sha256sum | cut -d' ' -f1)"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "name='com.tvbrowser.app'" | grep -F "versionName='$PEBBLE_VERSION'"
          mkdir -p release-assets
          cp "$APK" "release-assets/pebble-$RELEASE_TAG.apk"
          cp app/build/outputs/mapping/release/mapping.txt "release-assets/pebble-$RELEASE_TAG-mapping.txt"
          cp docs/release-signing-certificate.pem release-assets/
          cd release-assets
          sha256sum "pebble-$RELEASE_TAG.apk" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/pebble-release-draft"; then
            test "$(cat "$RUNNER_TEMP/pebble-release-draft")" = true || { echo 'Release is already published; use a new version tag' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Pebble TV Browser $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pebble-release.jks"
